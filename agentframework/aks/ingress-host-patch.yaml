apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentframework-chatbot
spec:
  tls:
    - hosts:
        - ai.roykim.ca
      secretName: agentframework-chatbot-tls
  rules:
    - host: ai.roykim.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentframework-chatbot
                port:
                  number: 80
