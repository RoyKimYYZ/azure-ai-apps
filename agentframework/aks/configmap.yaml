apiVersion: v1
kind: ConfigMap
metadata:
  name: agentframework-chatbot-config
data:
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"
  PORT: "8501"
  WORKERS: "1"
  TIMEOUT: "60"
  FITNESS_DB_BACKEND: "azuresql"
  AZURE_SQL_SERVER: "rkaks-sqlserver.database.windows.net"
  AZURE_SQL_DATABASE: "rkaksDB"
  AZURE_SQL_SCHEMA: "dbo"
  AZURE_SQL_DRIVER: "ODBC Driver 18 for SQL Server"
  AZURE_SQL_AUTH_MODE: "adminpassword"
  AZURE_SQL_ENCRYPT: "true"
  AZURE_SQL_TRUST_SERVER_CERTIFICATE: "false"
  AZURE_SQL_CONNECTION_TIMEOUT: "30"
  OTEL_SERVICE_NAME: "agentframework-chatbot"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  AZURE_OPENAI_ENDPOINT: "https://rk-ai-services-project-eus2-reso.openai.azure.com/"
  AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: "gpt-5.2-chat"
  AZURE_OPENAI_API_VERSION: ""
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-ada-002"
  AZURE_OPENAI_RESPONSES_DEPLOYMENT_NAME: "gpt-5.2-responses"
  AI_FOUNDRY_ENDPOINT: "https://rk-ai-services-project-eus2-reso.openai.azure.com/"
  AI_FOUNDRY_MODEL: "gpt-5.2-chat"
  AI_FOUNDRY_MODELS: ""
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
